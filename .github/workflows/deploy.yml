name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Clight.Brand.System.sln

      - name: Run Unit Tests
        run: dotnet test tests/Clight.Brand.Tests/Clight.Brand.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish Blazor WebAssembly Studio
        run: dotnet publish src/Clight.LogoStudio.Wasm/Clight.LogoStudio.Wasm.csproj -c Release -o release --no-restore

      - name: Configure GitHub Pages Routing & SPA Fallback
        run: |
          # Ensure .nojekyll exists so GitHub Pages serves _framework directory
          touch release/wwwroot/.nojekyll

          # Set repository base href in index.html for GitHub Pages
          sed -i 's/<base href="\/" \/>/<base href="\/Clight.Brand.System\/" \/>/g' release/wwwroot/index.html

          # Copy index.html to 404.html for Blazor client-side routing on GitHub Pages
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
